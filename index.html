<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Happy Seal Games ve geliştirme aşamasındaki strateji oyunu ZAR hakkında bilgi edinin. ZAR Alpha sürümünü itch.io üzerinden deneyin.">
  <meta name="theme-color" content="#f9c80e">
  <meta property="og:title" content="Happy Seal Games">
  <meta property="og:description" content="Bağımsız oyunlar, güçlü fikirler ve bolca eğlence. ZAR Alpha şimdi itch.io'da.">
  <meta property="og:url" content="https://happy-seal-games.github.io/happysealgames.github.io/">
  <meta property="og:image" content="https://happy-seal-games.github.io/happysealgames.github.io/assets/images/happy-seal-games-logo.png?v=2">
  <meta property="og:image:secure_url" content="https://happy-seal-games.github.io/happysealgames.github.io/assets/images/happy-seal-games-logo.png?v=2">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="796">
  <meta property="og:image:height" content="508">
  <meta property="og:image:alt" content="Happy Seal Games logo">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Happy Seal Games">
  <meta name="twitter:description" content="Independent games, bold ideas, and ZAR — our physics-based 3D dice roguelike.">
  <meta name="twitter:image" content="https://happy-seal-games.github.io/happysealgames.github.io/assets/images/happy-seal-games-logo.png?v=2">
  <link rel="canonical" href="https://happy-seal-games.github.io/happysealgames.github.io/">
  <title>Happy Seal Games</title>
  <link rel="icon" href="assets/images/happy-seal-games-logo.png" type="image/png">
  <script src="scripts/theme.js"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="top-anchor" id="top" aria-hidden="true"></div>
  <a class="skip-link" href="#main" data-i18n="skip"></a>

  <header class="site-header">
    <a class="brand" href="#top" aria-label="Happy Seal Games ana sayfa" data-i18n-aria="brandHome">
      <strong data-i18n-html="brandName"></strong>
    </a>

    <button class="menu-button" type="button" aria-expanded="false" aria-controls="main-nav">
      <span class="sr-only" data-i18n="menuOpen"></span>
      <span></span><span></span><span></span>
    </button>

    <nav class="main-nav" id="main-nav" aria-label="Ana menü" data-i18n-aria="navLabel">
      <div class="nav-links">
        <a href="#about-us" data-i18n="navAbout"></a>
        <a class="nav-zar-link" href="#zar"><img class="zar-mini-logo nav-zar-logo" src="assets/images/games/zar/mini-logo.png" alt="" width="630" height="500"><span>ZAR</span></a>
        <a href="#other-games" data-i18n="navGames"></a>
        <a href="#contact" data-i18n="navContact"></a>
      </div>
      <div class="language-switcher" aria-label="Dil seçimi" data-i18n-aria="languageLabel">
        <button type="button" data-language="tr" aria-label="Türkçe">TR</button>
        <button type="button" data-language="en" aria-label="English">EN</button>
      </div>
      <label class="theme-switch" for="theme-toggle">
        <input class="sr-only" id="theme-toggle" type="checkbox" data-i18n-aria="themeToggle">
        <span class="theme-switch-track" aria-hidden="true">
          <span class="theme-switch-label theme-switch-day" data-i18n="themeDay"></span>
          <span class="theme-switch-label theme-switch-night" data-i18n="themeNight"></span>
          <span class="theme-switch-thumb"><span class="theme-switch-crescent"></span></span>
        </span>
      </label>
    </nav>
  </header>

  <main id="main">
    <section class="studio-intro" id="about-us" aria-labelledby="hero-title">
    <div class="hero">
      <div class="comic-shape comic-shape-one" aria-hidden="true"></div>
      <div class="comic-shape comic-shape-two" aria-hidden="true"></div>

      <div class="hero-content reveal">
        <p class="eyebrow" data-i18n="heroEyebrow"></p>
        <h1 id="hero-title" data-i18n-html="heroTitle"></h1>
        <p class="hero-copy" data-i18n="heroCopy"></p>
        <div class="hero-actions">
          <a class="button button-dark" href="#zar"><img class="zar-mini-logo" src="assets/images/games/zar/mini-logo.png" alt="" width="630" height="500"><span data-i18n-html="heroTry"></span></a>
          <a class="text-link" href="#studio-details" data-i18n-html="heroDiscover"></a>
        </div>
      </div>

      <div class="hero-art reveal">
        <div class="burst" aria-hidden="true"></div>
        <div class="hero-logo-frame">
          <img src="assets/images/happy-seal-games-logo.png" alt="" data-i18n-alt="heroAlt" width="796" height="508">
        </div>
        <span class="sticker sticker-alpha" data-i18n-html="heroSticker"></span>
      </div>
      <a class="section-jump" href="#studio-details" data-i18n-aria="nextSection"><span aria-hidden="true">↓</span></a>
    </div>

    <div class="about section" id="studio-details" aria-labelledby="about-title">
      <div class="section-heading reveal">
        <p class="eyebrow" data-i18n="aboutEyebrow"></p>
        <h2 id="about-title" data-i18n-html="aboutTitle"></h2>
      </div>

      <div class="about-card reveal">
        <div class="about-copy">
          <p class="lead" data-i18n="aboutLead"></p>
          <p data-i18n="aboutBody"></p>
          <a class="text-link" href="#contact" data-i18n-html="aboutContact"></a>
        </div>
        <div class="studio-points">
          <article><b>01</b><strong data-i18n="studioPoint1Title"></strong><span data-i18n="studioPoint1Body"></span></article>
          <article><b>02</b><strong data-i18n="studioPoint2Title"></strong><span data-i18n="studioPoint2Body"></span></article>
          <article><b>03</b><strong data-i18n="studioPoint3Title"></strong><span data-i18n="studioPoint3Body"></span></article>
        </div>
      </div>
    </div>
    </section>

    <section class="zar-showcase section" id="zar" aria-labelledby="zar-title">
      <div class="zar-intro">
        <div class="zar-copy reveal">
          <p class="eyebrow eyebrow-light" data-i18n="zarEyebrow"></p>
          <img class="zar-wordmark" src="assets/images/games/zar/logo.png" alt="ZAR" width="315" height="250">
          <h2 id="zar-title" data-i18n-html="zarTitle"></h2>
          <p class="zar-lead" data-i18n="zarBody"></p>

          <div class="zar-tags" data-i18n-aria="zarTagsLabel" data-i18n-html="zarTags"></div>

          <ul class="feature-list" aria-label="ZAR özellikleri" data-i18n-aria="featuresLabel">
            <li data-i18n-html="feature1"></li>
            <li data-i18n-html="feature2"></li>
            <li data-i18n-html="feature3"></li>
          </ul>

          <a class="button button-yellow" href="https://happysealgames.itch.io/zar" target="_blank" rel="noopener noreferrer"><img class="zar-mini-logo" src="assets/images/games/zar/mini-logo.png" alt="" width="630" height="500"><span data-i18n-html="playItch"></span></a>
        </div>

        <div class="zar-character-stage reveal">
          <div class="comic-burst" aria-hidden="true"></div>
          <img src="assets/images/games/zar/main-character.png" alt="" data-i18n-alt="zarCharacterAlt" width="840" height="1080">
          <p data-i18n="zarSpeech"></p>
        </div>
      </div>

      <div class="zar-gameplay reveal">
        <div class="zar-subheading">
          <p class="eyebrow eyebrow-light" data-i18n="zarGameplayEyebrow"></p>
          <h3 data-i18n="zarGameplayTitle"></h3>
        </div>
        <div class="zar-gallery">
          <figure>
            <img src="assets/images/games/zar/loadout.gif" alt="" data-i18n-alt="zarLoadoutAlt" width="300" height="300">
            <figcaption data-i18n="zarLoadoutCaption"></figcaption>
          </figure>
          <figure>
            <img src="assets/images/games/zar/relics.gif" alt="" data-i18n-alt="zarRelicsAlt" width="400" height="400">
            <figcaption data-i18n="zarRelicsCaption"></figcaption>
          </figure>
          <figure>
            <img src="assets/images/games/zar/physics.gif" alt="" data-i18n-alt="zarPhysicsAlt" width="400" height="400">
            <figcaption data-i18n="zarPhysicsCaption"></figcaption>
          </figure>
        </div>
      </div>

      <div class="steam-panel reveal">
        <img src="assets/images/games/zar/steam-banner.png" alt="" data-i18n-alt="steamAlt" width="1920" height="360">
        <div class="steam-note">
          <strong data-i18n="steamTitle"></strong>
          <span data-i18n="steamBody"></span>
        </div>
      </div>

      <div class="zar-roadmap reveal" id="roadmap" aria-labelledby="roadmap-title">
        <div class="roadmap-link-card">
          <div>
            <p class="section-kicker" data-i18n="roadmapEyebrow"></p>
            <h2 id="roadmap-title" data-i18n="roadmapTitle"></h2>
            <p data-i18n="roadmapBody"></p>
          </div>
          <a class="simple-button" href="assets/images/games/zar/roadmap.png" target="_blank" rel="noopener" data-i18n-aria="roadmapOpen"><img class="zar-mini-logo" src="assets/images/games/zar/mini-logo.png" alt="" width="630" height="500"><span data-i18n-html="roadmapButton"></span></a>
        </div>
      </div>
    </section>

    <section class="games-section section" id="other-games" aria-labelledby="games-title">
      <div class="simple-heading reveal">
        <p class="section-kicker" data-i18n="gamesEyebrow"></p>
        <h2 id="games-title" data-i18n="gamesTitle"></h2>
        <p data-i18n="gamesIntro"></p>
      </div>

      <div class="games-grid reveal" id="games-grid"></div>
    </section>

    <section class="contact section" id="contact" aria-labelledby="contact-title">
      <div class="contact-intro reveal">
        <p class="eyebrow" data-i18n="contactEyebrow"></p>
        <h2 id="contact-title" data-i18n-html="contactTitle"></h2>
        <p data-i18n="contactBody"></p>
        <a class="button button-dark" href="mailto:happysealteam@gmail.com" data-i18n-html="emailButton"></a>
      </div>

      <div class="contact-content reveal">
        <form class="contact-form" id="contact-form" action="https://formsubmit.co/happysealteam@gmail.com" data-ajax-action="https://formsubmit.co/ajax/happysealteam@gmail.com" method="post" enctype="multipart/form-data">
          <input type="hidden" name="_subject" value="Happy Seal Games Website Message">
          <input type="hidden" name="_template" value="table">
          <input type="hidden" name="_captcha" value="true">
          <label class="form-honey" aria-hidden="true">Leave empty<input type="text" name="_honey" tabindex="-1" autocomplete="off"></label>

          <div class="contact-form-heading">
            <p class="section-kicker" data-i18n="formEyebrow"></p>
            <h3 data-i18n="formTitle"></h3>
            <p data-i18n="formIntro"></p>
          </div>

          <div class="form-grid">
            <label>
              <span data-i18n="formName"></span>
              <input type="text" name="name_or_nickname" required minlength="2" maxlength="60" autocomplete="nickname">
            </label>
            <label>
              <span data-i18n="formEmail"></span>
              <input id="contact-email" type="email" name="email" required maxlength="254" autocomplete="email" inputmode="email" autocapitalize="none" spellcheck="false">
            </label>
            <label class="form-wide">
              <span data-i18n="formSubject"></span>
              <input type="text" name="subject" required minlength="3" maxlength="100">
            </label>
            <label class="form-wide">
              <span data-i18n="formMessage"></span>
              <textarea name="message" required minlength="10" maxlength="4000" rows="7"></textarea>
            </label>
            <label class="form-wide file-field">
              <span data-i18n="formAttachment"></span>
              <input id="contact-attachment" type="file" name="attachment" accept="image/png,image/jpeg,image/webp,image/gif,application/pdf,text/plain" multiple aria-describedby="contact-attachment-help">
              <small id="contact-attachment-help" data-i18n="formAttachmentHelp"></small>
            </label>
          </div>

          <div class="form-submit-row">
            <button class="button button-dark" id="contact-submit" type="submit" data-i18n="formSubmit"></button>
            <p class="form-privacy" data-i18n="formPrivacy"></p>
          </div>
          <p class="form-status" id="contact-status" role="status" aria-live="polite"></p>
        </form>

        <div class="social-grid" aria-label="Sosyal medya bağlantıları" data-i18n-aria="socialLabel">
        <a class="social-instagram" href="https://www.instagram.com/happysealgames/" target="_blank" rel="noopener noreferrer" aria-label="Instagram" title="Instagram">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle class="fill" cx="17.5" cy="6.5" r="1.2"/></svg>
        </a>
        <a class="social-youtube" href="https://www.youtube.com/@HappySealGames" target="_blank" rel="noopener noreferrer" aria-label="YouTube" title="YouTube">
          <img src="assets/images/social/youtube.png" alt="" width="512" height="512">
        </a>
        <a class="social-x" href="https://x.com/happysealgame" target="_blank" rel="noopener noreferrer" aria-label="X (Twitter)" title="X (Twitter)">
          <img src="assets/images/social/x.png" alt="" width="512" height="512">
        </a>
        <a class="social-tiktok" href="https://www.tiktok.com/@happysealgames" target="_blank" rel="noopener noreferrer" aria-label="TikTok" title="TikTok">
          <img src="assets/images/social/tiktok.png" alt="" width="512" height="512">
        </a>
        <a class="social-threads" href="https://www.threads.com/@happysealgames?hl=tr" target="_blank" rel="noopener noreferrer" aria-label="Threads" title="Threads">
          <img src="assets/images/social/threads.png" alt="" width="500" height="500">
        </a>
        <a class="social-linkedin" href="https://www.linkedin.com/company/happy-seal-games?trk=public_post_feed-actor-name" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn" title="LinkedIn">
          <img src="assets/images/social/linkedin.png" alt="" width="512" height="512">
        </a>
        <a class="social-itch" href="https://happysealgames.itch.io/" target="_blank" rel="noopener noreferrer" aria-label="itch.io" title="itch.io">
          <img src="assets/images/social/itch-io.png" alt="" width="96" height="96">
        </a>
        <a class="social-email" href="mailto:happysealteam@gmail.com" aria-label="E-posta" data-i18n-aria="emailLabel" title="happysealteam@gmail.com">
          <img src="assets/images/social/gmail.png" alt="" width="512" height="512">
        </a>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p data-i18n="footerTagline"></p>
    <a href="#top" data-i18n="backToTop"></a>
    <small data-i18n-html="copyright"></small>
  </footer>

  <script src="content/tr.js"></script>
  <script src="content/en.js"></script>
  <script src="content/games.js"></script>
  <script src="scripts/render-games.js"></script>
  <script src="scripts/i18n.js"></script>
  <script src="scripts/navigation.js"></script>
  <script src="scripts/game-previews.js"></script>
  <script src="scripts/contact-form.js"></script>
  <script src="scripts/reveal.js"></script>
  <script src="scripts/main.js"></script>
</body>
</html>
